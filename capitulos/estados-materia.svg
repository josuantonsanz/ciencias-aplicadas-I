<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="Los tres estados de agregación y la disposición de sus partículas">
  <title>Los tres estados de agregación</title>

  <text x="450" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#16324f">Los tres estados de agregación</text>

  <!-- Panel sólido -->
  <rect x="20" y="60" width="270" height="230" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="155" y="92" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#2563eb">Sólido</text>
  <g fill="#2563eb">
    <circle cx="62" cy="130" r="11"/><circle cx="98" cy="130" r="11"/><circle cx="134" cy="130" r="11"/><circle cx="170" cy="130" r="11"/><circle cx="206" cy="130" r="11"/><circle cx="242" cy="130" r="11"/>
    <circle cx="62" cy="166" r="11"/><circle cx="98" cy="166" r="11"/><circle cx="134" cy="166" r="11"/><circle cx="170" cy="166" r="11"/><circle cx="206" cy="166" r="11"/><circle cx="242" cy="166" r="11"/>
    <circle cx="62" cy="202" r="11"/><circle cx="98" cy="202" r="11"/><circle cx="134" cy="202" r="11"/><circle cx="170" cy="202" r="11"/><circle cx="206" cy="202" r="11"/><circle cx="242" cy="202" r="11"/>
    <circle cx="62" cy="238" r="11"/><circle cx="98" cy="238" r="11"/><circle cx="134" cy="238" r="11"/><circle cx="170" cy="238" r="11"/><circle cx="206" cy="238" r="11"/><circle cx="242" cy="238" r="11"/>
  </g>
  <text x="155" y="316" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#475569">Partículas muy juntas</text>
  <text x="155" y="337" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#475569">y ordenadas</text>

  <!-- Panel líquido -->
  <rect x="315" y="60" width="270" height="230" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="450" y="92" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#0e9f6e">Líquido</text>
  <g fill="#0e9f6e">
    <circle cx="330" cy="225" r="11"/><circle cx="350" cy="250" r="11"/><circle cx="380" cy="230" r="11"/><circle cx="410" cy="255" r="11"/><circle cx="440" cy="225" r="11"/><circle cx="470" cy="250" r="11"/><circle cx="500" cy="228" r="11"/><circle cx="530" cy="252" r="11"/><circle cx="560" cy="232" r="11"/><circle cx="575" cy="220" r="11"/>
    <circle cx="365" cy="275" r="11"/><circle cx="400" cy="270" r="11"/><circle cx="435" cy="272" r="11"/><circle cx="470" cy="270" r="11"/><circle cx="505" cy="272" r="11"/><circle cx="540" cy="268" r="11"/>
  </g>
  <text x="450" y="316" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#475569">Partículas juntas, pero</text>
  <text x="450" y="337" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#475569">pueden deslizarse</text>

  <!-- Panel gaseoso -->
  <rect x="610" y="60" width="270" height="230" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="745" y="92" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#ea7317">Gaseoso</text>
  <g fill="#ea7317">
    <circle cx="650" cy="120" r="11"/><circle cx="720" cy="150" r="11"/><circle cx="810" cy="110" r="11"/><circle cx="680" cy="205" r="11"/><circle cx="760" cy="235" r="11"/><circle cx="840" cy="200" r="11"/><circle cx="660" cy="265" r="11"/><circle cx="800" cy="270" r="11"/>
  </g>
  <text x="745" y="316" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#475569">Partículas muy</text>
  <text x="745" y="337" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#475569">separadas</text>
</svg>
