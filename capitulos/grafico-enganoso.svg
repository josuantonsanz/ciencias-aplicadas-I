<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 540" width="1150" height="540" role="img" aria-label="Dos gráficos con los mismos datos: uno con el eje vertical recortado y otro con el eje completo desde cero">
  <title>El mismo dato dibujado de dos maneras</title>

  <text x="575" y="42" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#16324f">El mismo dato dibujado de dos maneras</text>
  <text x="575" y="72" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#475569">Temperatura media de un lugar, de 2019 a 2024. Son los mismos números; lo único que cambia es el eje vertical.</text>

  <!-- Panel izquierdo: eje recortado -->
  <text x="325" y="128" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#b91c1c">Eje recortado: de 13,8 a 14,4 °C</text>
  <g stroke="#e2e8f0" stroke-width="1.5">
    <line x1="110" y1="150" x2="540" y2="150"/>
    <line x1="110" y1="195" x2="540" y2="195"/>
    <line x1="110" y1="240" x2="540" y2="240"/>
    <line x1="110" y1="285" x2="540" y2="285"/>
    <line x1="110" y1="330" x2="540" y2="330"/>
    <line x1="110" y1="375" x2="540" y2="375"/>
  </g>
  <g stroke="#475569" stroke-width="2">
    <line x1="110" y1="150" x2="110" y2="420"/>
    <line x1="110" y1="420" x2="540" y2="420"/>
  </g>
  <g font-family="sans-serif" font-size="16" fill="#334155" text-anchor="end">
    <text x="100" y="155">14,4</text>
    <text x="100" y="200">14,3</text>
    <text x="100" y="245">14,2</text>
    <text x="100" y="290">14,1</text>
    <text x="100" y="335">14,0</text>
    <text x="100" y="380">13,9</text>
    <text x="100" y="425">13,8</text>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#64748b" text-anchor="middle">
    <text x="150" y="440">2019</text>
    <text x="210" y="440">2020</text>
    <text x="270" y="440">2021</text>
    <text x="330" y="440">2022</text>
    <text x="390" y="440">2023</text>
    <text x="450" y="440">2024</text>
  </g>
  <polyline points="150,375 210,375 270,330 330,285 390,285 450,195" fill="none" stroke="#b91c1c" stroke-width="3" stroke-linejoin="round"/>
  <g fill="#b91c1c">
    <circle cx="150" cy="375" r="5"/>
    <circle cx="210" cy="375" r="5"/>
    <circle cx="270" cy="330" r="5"/>
    <circle cx="330" cy="285" r="5"/>
    <circle cx="390" cy="285" r="5"/>
    <circle cx="450" cy="195" r="5"/>
  </g>
  <text x="310" y="405" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#b91c1c">¡parece que se dispara!</text>
  <text x="325" y="484" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#475569">Lo que ha subido es 0,4 °C.</text>

  <!-- Panel derecho: eje completo -->
  <text x="905" y="128" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#16324f">Eje completo: de 0 a 15 °C</text>
  <g stroke="#e2e8f0" stroke-width="1.5">
    <line x1="690" y1="240" x2="1120" y2="240"/>
    <line x1="690" y1="330" x2="1120" y2="330"/>
  </g>
  <g stroke="#475569" stroke-width="2">
    <line x1="690" y1="150" x2="690" y2="420"/>
    <line x1="690" y1="420" x2="1120" y2="420"/>
  </g>
  <g font-family="sans-serif" font-size="16" fill="#334155" text-anchor="end">
    <text x="680" y="155">15</text>
    <text x="680" y="245">10</text>
    <text x="680" y="335">5</text>
    <text x="680" y="425">0</text>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#64748b" text-anchor="middle">
    <text x="730" y="440">2019</text>
    <text x="790" y="440">2020</text>
    <text x="850" y="440">2021</text>
    <text x="910" y="440">2022</text>
    <text x="970" y="440">2023</text>
    <text x="1030" y="440">2024</text>
  </g>
  <polyline points="730,170 790,170 850,168 910,166 970,166 1030,164" fill="none" stroke="#16324f" stroke-width="3" stroke-linejoin="round"/>
  <g fill="#16324f">
    <circle cx="730" cy="170" r="5"/>
    <circle cx="790" cy="170" r="5"/>
    <circle cx="850" cy="168" r="5"/>
    <circle cx="910" cy="166" r="5"/>
    <circle cx="970" cy="166" r="5"/>
    <circle cx="1030" cy="164" r="5"/>
  </g>
  <text x="900" y="300" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#16324f">y aquí parece que no cambia nada</text>
  <text x="905" y="484" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#475569">El aumento es real, pero pequeño.</text>

  <text x="575" y="516" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#475569">El truco no está en los datos: está en dónde empieza el eje. Mira siempre el eje antes de sacar conclusiones.</text>
</svg>
