<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" role="img" aria-label="Esquema del efecto invernadero: la luz del Sol entra, la superficie emite calor y los gases devuelven parte de ese calor">
  <title>El efecto invernadero</title>
  <defs>
    <marker id="calido" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="frio" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="gris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="550" y="40" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#16324f">El efecto invernadero</text>
  <text x="550" y="70" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#475569">Sin estos gases la Tierra sería un lugar congelado; el problema es intensificarlos</text>

  <!-- Sol -->
  <g>
    <circle cx="80" cy="115" r="34" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
    <g stroke="#d97706" stroke-width="3" stroke-linecap="round">
      <line x1="80" y1="66" x2="80" y2="52"/>
      <line x1="80" y1="164" x2="80" y2="178"/>
      <line x1="31" y1="115" x2="17" y2="115"/>
      <line x1="129" y1="115" x2="143" y2="115"/>
      <line x1="45" y1="80" x2="35" y2="70"/>
      <line x1="115" y1="80" x2="125" y2="70"/>
      <line x1="45" y1="150" x2="35" y2="160"/>
      <line x1="115" y1="150" x2="125" y2="160"/>
    </g>
  </g>

  <!-- Luz del Sol que entra -->
  <g stroke="#d97706" stroke-width="3" marker-end="url(#calido)">
    <line x1="140" y1="158" x2="384" y2="442"/>
    <line x1="188" y1="200" x2="432" y2="442"/>
    <line x1="236" y1="242" x2="480" y2="442"/>
  </g>
  <text x="150" y="330" font-family="sans-serif" font-size="18" fill="#b45309" transform="rotate(56 150 330)">luz del Sol</text>

  <!-- Capa de gases -->
  <g fill="#cbd5e1" stroke="#64748b" stroke-width="2">
    <circle cx="600" cy="300" r="9"/>
    <circle cx="660" cy="300" r="9"/>
    <circle cx="720" cy="300" r="9"/>
    <circle cx="780" cy="300" r="9"/>
    <circle cx="840" cy="300" r="9"/>
    <circle cx="900" cy="300" r="9"/>
    <circle cx="960" cy="300" r="9"/>
    <circle cx="1020" cy="300" r="9"/>
    <circle cx="630" cy="332" r="9"/>
    <circle cx="690" cy="332" r="9"/>
    <circle cx="750" cy="332" r="9"/>
    <circle cx="810" cy="332" r="9"/>
    <circle cx="870" cy="332" r="9"/>
    <circle cx="930" cy="332" r="9"/>
    <circle cx="990" cy="332" r="9"/>
  </g>
  <text x="560" y="250" font-family="sans-serif" font-size="19" font-weight="700" fill="#334155">gases de efecto invernadero</text>
  <text x="560" y="272" font-family="sans-serif" font-size="19" font-weight="700" fill="#334155">CO₂, CH₄, vapor de agua</text>

  <!-- Calor de la superficie -->
  <g stroke="#b91c1c" stroke-width="3" fill="none">
    <line x1="820" y1="450" x2="820" y2="352" marker-end="url(#frio)"/>
    <line x1="820" y1="290" x2="820" y2="150" marker-end="url(#frio)"/>
    <path d="M820,290 C760,272 742,340 748,444" marker-end="url(#frio)"/>
  </g>
  <text x="838" y="140" font-family="sans-serif" font-size="19" fill="#b91c1c">calor que escapa</text>
  <text x="726" y="420" text-anchor="end" font-family="sans-serif" font-size="19" fill="#b91c1c">parte del calor vuelve</text>
  <text x="838" y="420" font-family="sans-serif" font-size="19" fill="#b91c1c">calor que emite</text>
  <text x="838" y="440" font-family="sans-serif" font-size="19" fill="#b91c1c">la superficie</text>

  <!-- Superficie -->
  <line x1="40" y1="455" x2="1060" y2="455" stroke="#475569" stroke-width="3"/>
  <rect x="40" y="455" width="1020" height="45" fill="#e2e8f0"/>
  <g>
    <line x1="150" y1="455" x2="150" y2="425" stroke="#475569" stroke-width="3"/>
    <polygon points="150,380 122,428 178,428" fill="#64748b"/>
    <line x1="205" y1="455" x2="205" y2="432" stroke="#475569" stroke-width="3"/>
    <polygon points="205,398 183,436 227,436" fill="#64748b"/>
  </g>
  <text x="60" y="484" font-family="sans-serif" font-size="19" fill="#334155">superficie terrestre</text>

  <!-- Leyenda -->
  <g font-family="sans-serif" font-size="18" fill="#334155">
    <circle cx="60" cy="532" r="12" fill="#16324f"/>
    <text x="60" y="538" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text>
    <text x="86" y="538">La luz del Sol entra y calienta la superficie.</text>

    <circle cx="60" cy="566" r="12" fill="#16324f"/>
    <text x="60" y="572" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text>
    <text x="86" y="572">La superficie, caliente, emite calor hacia arriba.</text>

    <circle cx="60" cy="600" r="12" fill="#16324f"/>
    <text x="60" y="606" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3</text>
    <text x="86" y="606">Los gases retienen parte de ese calor y lo devuelven: la Tierra no se enfría.</text>
  </g>
</svg>
