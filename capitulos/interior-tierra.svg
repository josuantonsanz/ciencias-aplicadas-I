<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 620" width="1150" height="620" role="img" aria-label="Corte esquemático del interior de la Tierra: corteza, manto, núcleo externo y núcleo interno, con la litosfera partida en placas">
  <title>El interior de la Tierra</title>

  <text x="575" y="52" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#16324f">El interior de la Tierra</text>

  <!-- Corte -->
  <g>
    <rect x="150" y="150" width="550" height="320" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="150" y="110" width="550" height="40" fill="#475569"/>
    <rect x="150" y="250" width="550" height="80" fill="#cbd5e1" opacity="0.85"/>
    <rect x="150" y="470" width="550" height="55" fill="#f6c4a8"/>
    <rect x="150" y="525" width="550" height="35" fill="#e08b63"/>
    <rect x="150" y="110" width="550" height="450" fill="none" stroke="#334155" stroke-width="2"/>
    <g stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5">
      <line x1="150" y1="250" x2="700" y2="250"/>
      <line x1="150" y1="330" x2="700" y2="330"/>
    </g>
  </g>

  <!-- Falla entre dos placas -->
  <line x1="430" y1="110" x2="430" y2="250" stroke="#ffffff" stroke-width="4"/>
  <line x1="430" y1="110" x2="430" y2="250" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- Placas en la superficie -->
  <g stroke="#16324f" stroke-width="3" stroke-linecap="round">
    <line x1="360" y1="92" x2="300" y2="92"/>
    <line x1="500" y1="92" x2="560" y2="92"/>
  </g>
  <g fill="#16324f">
    <polygon points="300,92 312,86 312,98"/>
    <polygon points="560,92 548,86 548,98"/>
  </g>
  <text x="240" y="86" text-anchor="end" font-family="sans-serif" font-size="19" font-weight="700" fill="#16324f">placa</text>
  <text x="620" y="86" font-family="sans-serif" font-size="19" font-weight="700" fill="#16324f">placa</text>

  <!-- Etiquetas dentro del corte -->
  <text x="192" y="137" font-family="sans-serif" font-size="19" font-weight="700" fill="#ffffff">corteza</text>
  <text x="192" y="297" font-family="sans-serif" font-size="19" fill="#334155">material blando del manto</text>
  <text x="192" y="392" font-family="sans-serif" font-size="21" font-weight="700" fill="#16324f">manto</text>
  <text x="192" y="504" font-family="sans-serif" font-size="19" font-weight="700" fill="#7c2d12">núcleo externo (líquido)</text>
  <text x="192" y="549" font-family="sans-serif" font-size="19" font-weight="700" fill="#7c2d12">núcleo interno (sólido)</text>

  <!-- Llave de la litosfera -->
  <g stroke="#16324f" stroke-width="2" fill="none">
    <line x1="150" y1="110" x2="128" y2="110"/>
    <line x1="128" y1="110" x2="128" y2="250"/>
    <line x1="128" y1="250" x2="150" y2="250"/>
    <line x1="128" y1="110" x2="150" y2="110"/>
  </g>
  <text x="112" y="180" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#16324f" transform="rotate(-90 112 180)">litosfera</text>

  <!-- Leyenda de la derecha -->
  <g font-family="sans-serif">
    <rect x="760" y="120" width="22" height="22" rx="3" fill="#475569"/>
    <text x="796" y="138" font-size="20" font-weight="700" fill="#16324f">Corteza</text>
    <text x="796" y="162" font-size="18" fill="#475569">7 km bajo el mar; 30-70 km</text>
    <text x="796" y="182" font-size="18" fill="#475569">en los continentes.</text>

    <rect x="760" y="206" width="22" height="22" rx="3" fill="#cbd5e1"/>
    <text x="796" y="224" font-size="20" font-weight="700" fill="#16324f">Manto</text>
    <text x="796" y="248" font-size="18" fill="#475569">Roca caliente que se deforma</text>
    <text x="796" y="268" font-size="18" fill="#475569">muy despacio, sin fundirse.</text>

    <rect x="760" y="292" width="22" height="22" rx="3" fill="#f6c4a8"/>
    <text x="796" y="310" font-size="20" font-weight="700" fill="#16324f">Núcleo externo</text>
    <text x="796" y="334" font-size="18" fill="#475569">Metal fundido, muy caliente.</text>

    <rect x="760" y="356" width="22" height="22" rx="3" fill="#e08b63"/>
    <text x="796" y="374" font-size="20" font-weight="700" fill="#16324f">Núcleo interno</text>
    <text x="796" y="398" font-size="18" fill="#475569">Sólido, por la enorme presión</text>
    <text x="796" y="418" font-size="18" fill="#475569">que soporta.</text>
  </g>

  <text x="760" y="470" font-family="sans-serif" font-size="19" fill="#475569">La litosfera es la corteza más la parte</text>
  <text x="760" y="492" font-family="sans-serif" font-size="19" fill="#475569">alta del manto. Está partida en placas</text>
  <text x="760" y="514" font-family="sans-serif" font-size="19" fill="#475569">que se mueven unos centímetros al año.</text>

  <text x="575" y="596" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#475569">A escala real, la corteza de la Tierra sería como la piel de una manzana.</text>
</svg>
