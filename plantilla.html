<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITULO}} · {{SERIE}}</title>
  <meta name="description" content="{{TITULO}} — {{SERIE}}">
  <link rel="stylesheet" href="../styles.css">
  <!-- KaTeX se sirve localmente: el capítulo sigue funcionando sin Internet. -->
  <link rel="stylesheet" href="../lib/katex/katex.min.css">
</head>
<body>

  <!-- ======================= BARRA SUPERIOR ======================= -->
  <header class="topbar">
    <div class="topbar__title">
      <button class="btn btn--ghost topbar__menu" id="btn-menu" aria-label="Abrir índice">☰</button>
      <span class="topbar__brand">{{SERIE}}</span>
    </div>
    <div class="topbar__actions">
      <a class="btn btn--outline" href="{{VOLVER}}" title="Volver al índice general">⌂ <span class="btn__label">Índice</span></a>
      <button class="btn btn--outline" id="btn-print" title="Imprimir o guardar como PDF (Ctrl+P)">
        🖨️ <span class="btn__label">Imprimir / PDF</span>
      </button>
      <button class="btn btn--primary" id="btn-slides" title="Ver el contenido como diapositivas">
        ▶ <span class="btn__label">Diapositivas</span>
      </button>
    </div>
  </header>

  <div class="layout">

    <!-- ======================= ÍNDICE LATERAL ======================= -->
    <nav class="sidebar" id="sidebar" aria-label="Índice del capítulo">
      <p class="sidebar__title">Índice del capítulo</p>
      <ol class="toc" id="toc"><!-- se genera con JS --></ol>
      <p class="sidebar__hint">Pulsa <kbd>Ctrl</kbd>+<kbd>P</kbd> para imprimir / guardar como PDF.</p>
    </nav>

    <!-- ======================= CONTENIDO ======================= -->
    <main class="content" id="content">

      {{PORTADA}}

      {{CONTENIDO}}

      <footer class="page-footer">
        <p><a href="{{VOLVER}}">← Volver al índice</a> · {{SERIE}} · Material de aula</p>
      </footer>
    </main>
  </div>

  <!-- ======================= VISOR DE DIAPOSITIVAS ======================= -->
  <div class="slideshow" id="slideshow" hidden>
    <div class="slideshow__progress"><div class="slideshow__bar" id="slides-bar"></div></div>
    <button class="slideshow__close" id="slides-close" title="Salir (Esc)">✕</button>
    <div class="slideshow__stage" id="slides-stage"></div>
    <div class="slideshow__controls">
      <button class="slideshow__nav" id="slides-prev" title="Anterior (←)">←</button>
      <span class="slideshow__counter" id="slides-counter">1 / 1</span>
      <button class="slideshow__nav" id="slides-next" title="Siguiente (→)">→</button>
    </div>
  </div>

  <script src="../lib/katex/katex.min.js"></script>
  <script src="../lib/katex/auto-render.min.js"></script>
  <script>
    // $...$ para expresiones en línea y $$...$$ para fórmulas centradas.
    renderMathInElement(document.getElementById("content"), {
      delimiters: [
        { left: "$$", right: "$$", display: true },
        { left: "\\[", right: "\\]", display: true },
        { left: "$", right: "$", display: false },
        { left: "\\(", right: "\\)", display: false }
      ],
      throwOnError: false,
      strict: "warn"
    });
  </script>
  <script src="../script.js"></script>
</body>
</html>
